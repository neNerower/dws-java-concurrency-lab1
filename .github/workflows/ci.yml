name: CI

on:
  push:            # все ветки; чтобы ограничить — добавьте branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # та версия, на которой вы локально работаете

      - uses: gradle/actions/setup-gradle@v4   # кэширует ~/.gradle между запусками

      - name: Run tests
        run: ./gradlew test

      # отчёт при любом исходе — будет виден во вложении
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-report
          path: build/reports/tests/test/index.html
          if-no-files-found: ignore
